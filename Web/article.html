<body>

  <main class="container page-main article-layout">
    <section class="article-head">

    <section id="article-content" class="article-content"></section>

    <section id="article-gallery" class="duo section article-gallery">
      <img src="perspectives/images/silicon-valley-fire-1.jpg" alt="Gallery image 1">
      <img src="perspectives/images/silicon-valley-fire-3.jpg" alt="Gallery image 2">
    </section>

    <section class="section">
      <h2 style="font-size:40px;">Related articles or posts</h2>
      <div id="related-grid" class="related-grid"></div>
    </section>
  </main>

        </div>
        <div>

          <ul>
            <li><a href="perspectives.html">Perspectives</a></li>
            <li><a href="notes/index.html">Notes</a></li>
          </ul>
        </div>
        <div>
          <h4>Contact</h4>
          <ul>
            <li><a href="mailto:houyi.leo@example.com">Email</a></li>

  <script>
    const fallbackImage = 'perspectives/images/silicon-valley-fire-1.jpg';

    function formatDate(value, language = 'en') {
      const locale = language === 'fr' ? 'fr-FR' : 'en-US';
      return new Date(`${value}T00:00:00`).toLocaleDateString(locale, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function stripFrontMatter(markdown) {
      return markdown.replace(/^---[\s\S]*?---/, '').trim();
    }

    function normalizeId(value) {
      return String(value || '').trim().toLowerCase();
    }

    function resolveArticleTranslation(article, requestedLanguage) {
      const translations = article.translations;
      if (!translations || typeof translations !== 'object') {
        return {
          language: 'en',
          label: 'English',
          title: article.title,
          summary: article.summary,
          markdownFile: article.markdownFile
        };
      }

      const availableLanguages = Object.keys(translations);
      const fallbackLanguage = article.defaultLanguage && translations[article.defaultLanguage]
        ? article.defaultLanguage
        : availableLanguages[0];
      const language = translations[requestedLanguage] ? requestedLanguage : fallbackLanguage;

      return {
        language,
        ...translations[language]
      };
    }

    function renderLanguageSwitcher(article, currentLanguage) {
      const switcherEl = document.getElementById('article-language-switcher');
      const translations = article.translations;

      if (!translations || Object.keys(translations).length < 2) {
        switcherEl.hidden = true;
        switcherEl.innerHTML = '';
        return;
      }

      switcherEl.hidden = false;
      switcherEl.innerHTML = `
        <div class="article-language-options" role="group" aria-label="Choose article language">
          ${Object.entries(translations).map(([language, translation]) => {
            const isActive = language === currentLanguage;
            const href = `article.html?id=${encodeURIComponent(article.id)}&lang=${encodeURIComponent(language)}`;
            return `
              <a
                class="article-language-link${isActive ? ' is-active' : ''}"
                href="${href}"
                lang="${escapeHtml(language)}"
                ${isActive ? 'aria-current="page"' : ''}
              >${escapeHtml(translation.label || language.toUpperCase())}</a>
            `;
          }).join('')}
        </div>
      `;
    }

    async function fetchMarkdownWithFallback(markdownPath) {
      const first = await fetch(markdownPath);
      if (first.ok) {
        return first.text();
      }

      const fallbackPath = markdownPath.replace(/([^/]+)$/, (fileName) => fileName.toLowerCase());
      if (fallbackPath !== markdownPath) {
        const second = await fetch(fallbackPath);
        if (second.ok) {
          return second.text();
        }
      }

      throw new Error(`Markdown not found: ${markdownPath}`);
    }

    function renderArticleGallery(article) {
      const galleryEl = document.getElementById('article-gallery');
      const images = Array.isArray(article.galleryImages) && article.galleryImages.length > 0
        ? article.galleryImages
        : [
            { src: 'perspectives/images/silicon-valley-fire-1.jpg', alt: 'Gallery image 1' },
            { src: 'perspectives/images/silicon-valley-fire-3.jpg', alt: 'Gallery image 2' }
          ];

      if (images.length === 0) {
        galleryEl.classList.add('is-hidden');
        return;
      }

      galleryEl.classList.remove('is-hidden');
      galleryEl.innerHTML = images.slice(0, 2).map((image) => `
        <img src="${escapeHtml(image.src)}" alt="${escapeHtml(image.alt || article.title)}" onerror="this.src='${fallbackImage}'">
      `).join('');
    }

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');
      const requestedLanguage = normalizeId(params.get('lang'));

      const titleEl = document.getElementById('article-title');
      const subtitleEl = document.getElementById('article-subtitle');
      const imageEl = document.getElementById('article-image');
      const contentEl = document.getElementById('article-content');
      const relatedEl = document.getElementById('related-grid');

      try {
        const metaRes = await fetch('perspectives/articles.json?v=20260827a', { cache: 'no-store' });
        const articles = await metaRes.json();

        const normalizedArticleId = normalizeId(articleId);
        const selected = articles.find((article) => normalizeId(article.id) === normalizedArticleId) || articles[0];
        if (!selected) {
          titleEl.textContent = 'Article not found';
          subtitleEl.textContent = 'No article metadata is available.';
          return;
        }

        const translation = resolveArticleTranslation(selected, requestedLanguage);
        document.documentElement.lang = translation.language;
        document.title = `${translation.title} | Leo's Site`;
        titleEl.textContent = translation.title;
        subtitleEl.textContent = `${formatDate(selected.date, translation.language)} - ${translation.summary}`;
        imageEl.src = selected.imageUrl;
        imageEl.alt = translation.title;
        imageEl.onerror = () => { imageEl.src = fallbackImage; };
        renderLanguageSwitcher(selected, translation.language);
        renderArticleGallery(selected);

        try {
          const markdown = await fetchMarkdownWithFallback(translation.markdownFile);
          const converter = new showdown.Converter({ tables: true, strikethrough: true, tasklists: true });
          contentEl.innerHTML = converter.makeHtml(stripFrontMatter(markdown));
        } catch (error) {
          contentEl.innerHTML = '<p>Unable to load the markdown content for this article.</p>';
        }

        const related = articles.filter((article) => article.id !== selected.id).slice(0, 3);
        relatedEl.innerHTML = related.map((article) => `
          <article class="related-card">
            <a href="article.html?id=${article.id}">
              <img src="${article.imageUrl}" alt="${article.title}" onerror="this.src='${fallbackImage}'">
            </a>
            <h3><a href="article.html?id=${article.id}">${article.title}</a></h3>
            <p>${formatDate(article.date)}</p>
          </article>
        `).join('');
      } catch (error) {
        titleEl.textContent = 'Error loading article';
        subtitleEl.textContent = 'Please try again later.';
        contentEl.innerHTML = '<p>Failed to load article data.</p>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
